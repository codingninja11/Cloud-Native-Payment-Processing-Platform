name: CD - Deploy to AKS Dev

# Configure in GitHub: Settings > Secrets and variables > Actions
# Required secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Required variables: AZURE_RESOURCE_GROUP, AZURE_AKS_CLUSTER, ACR_NAME
# (Match Terraform outputs: resource group, aks_cluster_name, acr_name)

on:
  push:
    branches: [ main ]

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_AKS_CLUSTER: ${{ vars.AZURE_AKS_CLUSTER }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  AKS_NAMESPACE: dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build payment-service image
        run: |
          cd services/payment-service
          mvn -B -q package -DskipTests
          docker build -t $ACR_NAME.azurecr.io/payment-service:dev .
      - name: Build order-service image
        run: |
          cd services/order-service
          mvn -B -q package -DskipTests
          docker build -t $ACR_NAME.azurecr.io/order-service:dev .
      - name: Build fraud-service image
        run: |
          cd services/fraud-service
          mvn -B -q package -DskipTests
          docker build -t $ACR_NAME.azurecr.io/fraud-service:dev .

      - name: Azure Container Registry Login
        run: az acr login --name $ACR_NAME

      - name: Push images
        run: |
          docker push $ACR_NAME.azurecr.io/payment-service:dev
          docker push $ACR_NAME.azurecr.io/order-service:dev
          docker push $ACR_NAME.azurecr.io/fraud-service:dev

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group $AZURE_RESOURCE_GROUP \
            --name $AZURE_AKS_CLUSTER \
            --overwrite-existing

      - name: Update Helm dependencies
        run: |
          helm dependency update services/payment-service/chart
          helm dependency update services/order-service/chart
          helm dependency update services/fraud-service/chart

      - name: Deploy payment-service
        run: |
          helm upgrade --install payment-service ./services/payment-service/chart \
            -n $AKS_NAMESPACE \
            --set base-service.image.repository=$ACR_NAME.azurecr.io/payment-service \
            --set base-service.image.tag=dev

      - name: Deploy order-service
        run: |
          helm upgrade --install order-service ./services/order-service/chart \
            -n $AKS_NAMESPACE \
            --set base-service.image.repository=$ACR_NAME.azurecr.io/order-service \
            --set base-service.image.tag=dev

      - name: Deploy fraud-service
        run: |
          helm upgrade --install fraud-service ./services/fraud-service/chart \
            -n $AKS_NAMESPACE \
            --set base-service.image.repository=$ACR_NAME.azurecr.io/fraud-service \
            --set base-service.image.tag=dev

