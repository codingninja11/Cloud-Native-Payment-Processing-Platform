# Same DB_* env vars as payment-service. Orders from the UI hit this service (port 8081).
# You still need Kafka reachable for consumers; POST /api/orders saves to Postgres without waiting on Kafka.
spring:
  flyway:
    enabled: false
  datasource:
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        format_sql: true

management:
  endpoint:
    health:
      show-details: always
      show-components: always

logging:
  level:
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.orm.deprecation: ERROR
    com.zaxxer.hikari: DEBUG
    org.postgresql: DEBUG
