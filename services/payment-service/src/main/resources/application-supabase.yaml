# Activate with: SPRING_PROFILES_ACTIVE=supabase (plus DB_URL / DB_USERNAME / DB_PASSWORD from Supabase).
# Supabase → Project Settings → Database: use the direct host (port 5432), not the pooler, unless you know it's compatible.
# The subdomain is db.<PROJECT_REF>.supabase.co — PROJECT_REF is shown in the dashboard (not necessarily your GitHub username).
#
# Render / cloud: if Hikari "pool initialization" fails with timeout, try Supabase "Session pooler" JDBC URL (port 6543) or
# add IPv4 (Supabase dashboard) if the host resolves only over IPv6. Keep ?sslmode=require on DB_URL.
#
# If you already ran the CREATE TABLE scripts in the SQL Editor, turn Flyway off so migrations are not applied twice:
spring:
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        format_sql: true

# See whether Postgres is reachable: GET http://localhost:8080/actuator/health (db component should be UP)
management:
  endpoint:
    health:
      show-details: always
      show-components: always

logging:
  level:
    org.hibernate.orm.jdbc.bind: WARN
    # Hibernate 6.4 warns (HHH90000025) when dialect is explicit; we need it when JDBC metadata is disabled above.
    org.hibernate.orm.deprecation: ERROR
    # Surface the real reason when Hikari cannot reach Supabase (timeout, SSL, auth, etc.).
    com.zaxxer.hikari: DEBUG
    org.postgresql: DEBUG
