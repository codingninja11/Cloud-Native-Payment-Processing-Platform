base-service:
  image:
    # e.g. ghcr.io/my-org/payment-service (must match CD publish-images workflow)
    repository: ghcr.io/YOUR_GITHUB_OWNER/payment-service
    tag: "dev"
  service:
    port: 80
  ingress:
    enabled: true
    hosts:
      - host: REPLACE_ME_HOST
        path: /api/payments
  # Secret with keys: DB_URL, DB_USERNAME, DB_PASSWORD, KAFKA_BOOTSTRAP_SERVERS, EVENTHUB_CONNECTION_STRING
  configSecret: "platform-config"
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: "kubernetes"

